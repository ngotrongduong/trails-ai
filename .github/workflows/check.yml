name: check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # (the numbered parts of src/ are pieces of one script: they are checked joined, as dist/trails-ai.js)
      - name: The workers' code, the tools and the extension parse
        run: |
          for f in src/sim/*.js tools/*.js extension/*.js; do node --check "$f"; done
      - name: Built files are up to date (run "node tools/build.js" after changing src)
        run: |
          node tools/build.js
          node --check dist/trails-ai.js
          git diff --exit-code -- dist docs
